name: CI Pipeline - Booking Engine

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BookingSystem.slnx

      - name: Build
        run: dotnet build BookingSystem.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test BookingSystem.slnx --no-build --configuration Release --verbosity normal